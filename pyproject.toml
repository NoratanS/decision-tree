[project]
name = "decision-tree"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krzysztof Bielski", email = "kbielski23@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
decision-tree = "decision_tree.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["slow: takes seconds, not milliseconds; skip with -m \"not slow\""]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
